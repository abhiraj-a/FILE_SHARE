spring.application.name=FileManager
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


clerk.issuer=${CLERK_ISSUER}
clerk.jwks-url=${CLERK_JWKS_URL}
clerk.secret-key=${CLERK_WEBHOOK_SECRET}
clerk.api-secret=${CLERK_API_SECRET}

logging.level.root=INFO
logging.level.org.springframework.security=INFO


spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.bucket=${SUPABASE_BUCKET}

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.FileManager=DEBUG

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=5000ms

spring.data.redis.repositories.enabled=false

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB


cloudflare.r2.endpoint=https://<YOUR_ACCOUNT_ID>.r2.cloudflarestorage.com
cloudflare.r2.access-key=<YOUR_ACCESS_KEY>
cloudflare.r2.secret-key=<YOUR_SECRET_KEY>
cloudflare.r2.bucket=<YOUR_BUCKET_NAME>


aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.region=ap-south-1
aws.s3.bucket=${S3_BUCKET_NAME}


